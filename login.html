<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"><title>UniTransit - Login</title></head><body data-page="login"><header id="nav"></header>
<main class="wrap" style="max-width:460px"><div class="card" style="margin-top:30px"><div class="tabs"><button class="btn" data-tab="login">Log in</button><button class="btn alt" data-tab="reg">Sign up</button></div>
<form id="lf" novalidate><label>Email<input name="email" type="email" autocomplete="email"></label><label>Password<input name="password" type="password" autocomplete="current-password"></label><div id="lErr"></div><button class="btn" type="submit">Log in</button></form>
<form id="rf" hidden novalidate><label>Full name<input name="fullName" autocomplete="name"></label><label>Email<input name="email" type="email" autocomplete="email"></label><label>Password<input name="password" type="password" autocomplete="new-password"></label><label>Confirm password<input name="confirmPw" type="password" autocomplete="new-password"></label><div id="rErr"></div><button class="btn" type="submit">Create account</button></form>
<p class="note" style="margin-top:16px">Prototype: accounts are stored in this browser only.</p></div></main><script src="js/data.js"></script><script src="js/app.js"></script></body></html>
